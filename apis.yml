aid: blubblub
name: Blubblub
description: >-
  Blub Blub Inc. is the company behind Speech Blubs, a speech-therapy and
  language-development app for children aged 1 to 8. Created by speech-language
  pathologists and child-development experts, the app uses video modeling,
  speech exercises, face filters, and play-based activities to help kids with
  speech delays, autism, Down syndrome, and apraxia learn to talk. Speech Blubs
  is available on iOS and Android, supports English, Spanish, and German, and
  has been downloaded by over 10 million families worldwide. Blub Blub is a
  portfolio company of Speedinvest. This is a consumer mobile-app company; it
  does not publish a public developer API, OpenAPI specification, or developer
  portal, so the entry is limited to verified company identity and published
  web properties.
